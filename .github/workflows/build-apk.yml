name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Setup environment and keystore
      run: |
        if [ ! -f debug.keystore ]; then
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
        fi
        if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi
        if [ ! -f .env.example ]; then
          touch .env.example
        fi
        if [ ! -f .env ]; then
          cp .env.example .env 2>/dev/null || touch .env
        fi

    - name: Build with Gradle
      run: gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: latest
        name: Bass & EQ APK
        body: |
          🚀 **Свежая сборка Bass & EQ**
          
          - Скачать APK файл напрямую: [app-debug.apk](https://github.com/${{ github.repository }}/releases/download/latest/app-debug.apk)
          - Приложение для управления звуком и басом через Bluetooth
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
